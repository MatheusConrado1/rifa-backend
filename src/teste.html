<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Rifa - Teste Completo</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #34495e; padding: 20px; border-radius: 10px; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; margin: 5px;}
        input { padding: 8px; border-radius: 5px; border: none; }
        
        .board { display: none; margin-top: 20px; border-top: 2px solid #7f8c8d; padding-top: 20px;}
        .info-panel { background: #27ae60; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; }
        
        .players-area { display: flex; justify-content: space-around; background: #2c3e50; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .player-card { background: #1abc9c; padding: 10px; border-radius: 5px; text-align: center; width: 30%; }
        
        .center-table { background: #16a085; height: 120px; border-radius: 5px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;}
        
        .my-hand { background: #2980b9; padding: 15px; border-radius: 5px; text-align: center;}
        
        .playing-card { background: white; color: black; border-radius: 5px; padding: 15px 10px; font-size: 20px; font-weight: bold; width: 50px; text-align: center; display: inline-block; cursor: pointer; border: 2px solid #333; }
        .playing-card.red { color: #c0392b; }
        
        .action-panel { display: none; background: #f39c12; padding: 15px; text-align: center; border-radius: 5px; margin-bottom: 20px;}
        
        #logs { background: #1e272e; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #d2dae2; margin-top: 20px; }
        .error-msg { color: #ff7675; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rifa WebSockets</h2>
    
    <div id="setup">
        <input type="text" id="nome" placeholder="Seu Nome">
        <input type="text" id="mesaId" value="sala-1">
        <button onclick="entrarNaMesa()" style="background: #3498db; color: white;">1. Entrar na Mesa</button>
        <button onclick="iniciarJogo()" style="background: #2ecc71; color: white;">2. Iniciar Rodada</button>
    </div>

    <div id="gameBoard" class="board">
        <div class="info-panel">
            <h3 id="phaseDisplay" style="margin:0 0 10px 0;">FASE: ---</h3>
            <p style="margin:0;">💰 Pote: <b id="potDisplay">0</b> moedas | 🎴 Manilha: <b id="manilhaDisplay">---</b> | 🎯 Serviço: <b id="serviceDisplay">Nenhum</b></p>
        </div>

        <div class="players-area" id="opponentsArea">
            </div>

        <div class="center-table" id="centerTable">
            <span style="color: #ecf0f1; opacity: 0.7;">(Cartas jogadas na rodada)</span>
        </div>

        <div class="action-panel" id="actionPanel">
            <h3 style="margin: 0 0 10px 0;">Sua vez de decidir!</h3>
            <button onclick="enviarAcao('PLAY')" style="background: #27ae60; color: white;">Entrar no Jogo</button>
            <button onclick="enviarAcao('FOLD')" style="background: #c0392b; color: white;">Desistir (Fold)</button>
            <button onclick="enviarAcao('MACACA')" style="background: #8e44ad; color: white;">Pegar Macaca</button>
        </div>

        <div class="my-hand">
            <h3>Minha Mão</h3>
            <div id="myCards"></div>
        </div>
    </div>

    <div id="logs"></div>
</div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
    const socket = io('http://localhost:3000', { transports: ['websocket'], upgrade: false });
    const symbols = { 'hearts': '♥', 'diamonds': '♦', 'clubs': '♣', 'spades': '♠' };

    function addLog(msg, isError = false) {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        if (isError) div.className = 'error-msg';
        document.getElementById('logs').appendChild(div);
        document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
    }

    socket.on('connect', () => addLog('🟢 Conectado ao servidor!'));
    
    socket.on('rodada_iniciada', (data) => renderizarMesa(data.mesa));
    socket.on('estado_atualizado', (data) => renderizarMesa(data.mesa));

    function entrarNaMesa() {
        const nome = document.getElementById('nome').value || 'Anon';
        const mesaId = document.getElementById('mesaId').value;
        socket.emit('entrar_na_mesa', { nome, mesaId }, res => {
            if(res.status === 'erro') addLog(res.mensagem, true);
            else {
                addLog(`Entrou na mesa ${mesaId}`);
                document.getElementById('gameBoard').style.display = 'block';
            }
        });
    }

    function iniciarJogo() {
        const mesaId = document.getElementById('mesaId').value;
        socket.emit('iniciar_jogo', { mesaId }, res => {
            if(res.status === 'erro') addLog(res.mensagem, true);
        });
    }

    function enviarAcao(acao) {
        const mesaId = document.getElementById('mesaId').value;
        socket.emit('acao_aposta', { mesaId, acao }, res => {
            if(res.status === 'erro') addLog(res.mensagem, true);
        });
    }

    function jogarCarta(suit, rank) {
        const mesaId = document.getElementById('mesaId').value;
        socket.emit('jogar_carta', { mesaId, suit, rank }, res => {
            if(res.status === 'erro') addLog(`ERRO ILEGAL: ${res.mensagem}`, true);
        });
    }

    function renderizarMesa(mesa) {
        console.log("Estado Recebido:", mesa);
        
        document.getElementById('phaseDisplay').innerText = `FASE: ${mesa.phase}`;
        document.getElementById('potDisplay').innerText = mesa.pot;
        document.getElementById('manilhaDisplay').innerText = mesa.manilhaCard ? `${symbols[mesa.manilha]} ${mesa.manilhaCard.rank}` : '---';
        document.getElementById('serviceDisplay').innerText = mesa.service ? symbols[mesa.service] : 'Nenhum';

        const meuId = socket.id;
        let eu = null;
        let htmlOponentes = '';

        mesa.players.forEach((p, index) => {
            const isDealer = index === mesa.dealerIndex ? '👑 Dealer' : '';
            const isTurn = index === mesa.currentTurnIndex ? '👈 VEZ DELE' : '';
            
            if (p.id === meuId) {
                eu = p;
            } else {
                htmlOponentes += `
                    <div class="player-card">
                        <strong>${p.name} ${isDealer}</strong><br>
                        💰 ${p.coins} | Mãos ganhas: ${p.tricksWon}<br>
                        Cartas: ${p.cardCount}<br>
                        <small style="color:#f1c40f">${p.pendingPenalty > 0 ? 'Devendo Palha: '+p.pendingPenalty : ''}</small><br>
                        <b style="color:yellow">${isTurn}</b>
                    </div>
                `;
            }
        });
        document.getElementById('opponentsArea').innerHTML = htmlOponentes;

        let htmlCartas = '';
        if (eu && eu.hand.length > 0) {
            eu.hand.forEach(c => {
                const cor = (c.suit === 'hearts' || c.suit === 'diamonds') ? 'red' : 'black';
                htmlCartas += `<div class="playing-card ${cor}" onclick="jogarCarta('${c.suit}', '${c.rank}')">
                                  ${symbols[c.suit]}<br>${c.rank}
                               </div>`;
            });
        } else {
            htmlCartas = '<p style="color:#bdc3c7;">Você não tem cartas.</p>';
        }
        document.getElementById('myCards').innerHTML = htmlCartas;

        let htmlMesa = '';
        mesa.currentTrickCards.forEach(tc => {
            const cor = (tc.card.suit === 'hearts' || tc.card.suit === 'diamonds') ? 'red' : 'black';
            const donoDaCarta = mesa.players.find(p => p.id === tc.playerId)?.name || 'Alguém';
            
            htmlMesa += `
                <div style="text-align: center;">
                    <small style="color:white">${donoDaCarta}</small><br>
                    <div class="playing-card ${cor}">${symbols[tc.card.suit]}<br>${tc.card.rank}</div>
                </div>`;
        });
        if(htmlMesa === '') htmlMesa = '<span style="color: #ecf0f1; opacity: 0.7;">(Nenhuma carta jogada)</span>';
        document.getElementById('centerTable').innerHTML = htmlMesa;

        const isMyTurn = mesa.players[mesa.currentTurnIndex].id === meuId;
        if (mesa.phase === 'BETTING_PHASE' && isMyTurn && !eu.hasActed) {
            document.getElementById('actionPanel').style.display = 'block';
        } else {
            document.getElementById('actionPanel').style.display = 'none';
        }

        if (mesa.phase === 'GAME_OVER') {
            alert(`🎉 O JOGO ACABOU! Vencedor: ${mesa.players[0].name}`);
        }
    }
</script>
</body>
</html>
